# 笔记本专用：唯一目的是验证 SFT 管线（尤其 completion-only 掩码）能跑通
model_name: sshleifer/tiny-gpt2
data_dir: data/sft
output_dir: outputs/canary_sft
seq_len: 512
max_steps: 5
per_device_train_batch_size: 2
gradient_accumulation_steps: 1
learning_rate: 1.0e-3
logging_steps: 1
save_steps: 5
bf16: false
gradient_checkpointing: false
seed: 27355